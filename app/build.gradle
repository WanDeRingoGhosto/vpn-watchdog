plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def runNumberEnv = System.getenv("GITHUB_RUN_NUMBER")
def rawRun = (runNumberEnv != null && runNumberEnv.isInteger())
        ? runNumberEnv.toInteger()
        : 34
def patchNumber = Math.max(4, rawRun - 30)

android {
    namespace 'com.example.vpnwatchdog'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.vpnwatchdog"
        minSdk 26
        targetSdk 34
        versionCode patchNumber
        versionName "1.0.${patchNumber}"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
